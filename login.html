<!DOCTYPE html>
<html>
<head>
    <title>Private Birthday Website ❤️</title>

    <style>
        body {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
            padding-top: 120px;
        }

        .box {
            background: rgba(0, 0, 0, 0.25);
            padding: 35px;
            border-radius: 20px;
            width: 300px;
            margin: auto;
        }

        input {
            padding: 12px;
            border-radius: 10px;
            border: none;
            margin: 10px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #ff4f81;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>❤️ Private Website ❤️</h1>

        <p>Only for you and Anushka 💕</p>

        <form method="POST">
            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <br>

            <button type="submit">Open Surprise 🎁</button>
        </form>

        {% if error %}
            <p>{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
